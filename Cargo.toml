[package]
name = "lifewiki"
version = "0.1.0"
edition = "2021"
description = "A local-first event log"

[[bin]]
name = "lw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
goose-agent = "0.1.0-alpha.6"
goose-providers = "0.1.0-alpha.6"
libc = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.8"
ulid = "1.1"
