[package]
name = "lifewiki"
version = "0.1.0"
edition = "2021"
description = "A local-first event log"

[[bin]]
name = "lw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.92"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
goose-agent = "0.1.0-alpha.6"
goose-providers = { version = "0.1.0-alpha.6", features = ["rustls-tls", "local-inference"] }
goose-local-inference = { version = "0.1.0-alpha.6", optional = true }
libc = "0.2"
regex = "1.11"
rmcp = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
toml = "0.8"
ulid = "1.1"

[features]
default = []
# Local, offline inference via llama.cpp. Compiles llama.cpp from source, so
# it is off by default; see docs/pipeline.md.
local = ["dep:goose-local-inference"]
# Hardware acceleration. Each implies `local`.
metal = ["local", "goose-local-inference/mlx"]
cuda = ["local", "goose-local-inference/cuda"]
vulkan = ["local", "goose-local-inference/vulkan"]

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
